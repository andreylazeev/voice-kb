name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a new release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' android/app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Expected versionName in X.Y.Z format in android/app/build.gradle.kts.'
            exit 1
          fi
          tag="v$version"

          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq -- "$tag" <<< "$releases"; then
            echo "Release $tag already exists on GitHub. Skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.version.outputs.tag != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and build unsigned APK
        if: steps.version.outputs.tag != ''
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
          rustup target add aarch64-linux-android
          ./android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease

      - name: Sign and verify APK
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VOICEKB_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          VOICEKB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          VOICEKB_SIGNING_LINEAGE: ${{ secrets.ANDROID_RELEASE_LINEAGE }}
        run: |
          : "${VOICEKB_KEYSTORE:?Missing ANDROID_RELEASE_KEYSTORE}"
          : "${VOICEKB_KEYSTORE_PASSWORD:?Missing ANDROID_RELEASE_PASSWORD}"
          : "${VOICEKB_SIGNING_LINEAGE:?Missing ANDROID_RELEASE_LINEAGE}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/voicekb-signing.XXXXXXXX")
          trap 'rm -f -- "$signing_dir/release.p12" "$signing_dir/release.lineage"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$VOICEKB_KEYSTORE" | base64 --decode > "$signing_dir/release.p12"
          printf '%s' "$VOICEKB_SIGNING_LINEAGE" | base64 --decode > "$signing_dir/release.lineage"
          unset VOICEKB_KEYSTORE VOICEKB_SIGNING_LINEAGE

          tools="$ANDROID_HOME/build-tools/37.0.0"
          release_dir="$RUNNER_TEMP/voicekb-release"
          unsigned_apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          aligned_apk="$release_dir/aligned.apk"
          apk="VoiceKB-$VERSION-arm64.apk"
          mkdir -p "$release_dir"

          "$tools/zipalign" -P 16 -f 4 "$unsigned_apk" "$aligned_apk"
          "$tools/apksigner" sign --ks "$signing_dir/release.p12" --ks-type PKCS12 \
            --ks-pass env:VOICEKB_KEYSTORE_PASSWORD --lineage "$signing_dir/release.lineage" \
            --rotation-min-sdk-version 28 --v1-signing-enabled false \
            --v2-signing-enabled false --v4-signing-enabled false \
            --out "$release_dir/$apk" "$aligned_apk"
          unset VOICEKB_KEYSTORE_PASSWORD

          cd "$release_dir"
          "$tools/zipalign" -c -P 16 4 "$apk"
          verification=$("$tools/apksigner" verify --verbose --print-certs "$apk")
          expected_digest=ddf7598b791bc0f214d7edb5cc5fa5f3741a37a8b5a9d576a48d1807c141b557
          if ! grep -Eq "^.*Signer.* certificate SHA-256 digest: $expected_digest$" <<< "$verification"; then
            echo '::error::The APK signing certificate does not match the existing VoiceKB release key.'
            exit 1
          fi
          sha256sum "$apk" > SHA256SUMS.txt

      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # If the tag already exists, verify that it points at the commit we built.
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          tag_commit=$(awk 'END {print $1}' <<< "$refs")
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG already points at another commit ($tag_commit)."
            exit 1
          fi

          release_dir="$RUNNER_TEMP/voicekb-release"
          release_url=$(gh release create "$TAG" "$release_dir/VoiceKB-$VERSION-arm64.apk" \
            "$release_dir/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VoiceKB $VERSION" --generate-notes)
          printf 'Published [VoiceKB %s](%s)\n' "$VERSION" "$release_url" >> "$GITHUB_STEP_SUMMARY"
